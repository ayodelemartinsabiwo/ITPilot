[build]
builder = "NIXPACKS"
buildCommand = "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"

[deploy]
startCommand = "cd backend && daphne -b 0.0.0.0 -p $PORT core.asgi:application"
healthcheckPath = "/admin/"
restartPolicyType = "ON_FAILURE"
