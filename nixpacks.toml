[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = [
  "cd backend && python3 -m venv /opt/venv",
  "cd backend && /opt/venv/bin/pip install --upgrade pip",
  "cd backend && /opt/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd backend && /opt/venv/bin/python manage.py collectstatic --noinput",
  "cd backend && /opt/venv/bin/python manage.py migrate --noinput"
]

[start]
cmd = "bash -c 'cd backend && /opt/venv/bin/daphne -b 0.0.0.0 -p ${PORT} core.asgi:application'"
