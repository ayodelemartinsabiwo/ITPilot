[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = [
  "python3 -m venv /app/venv",
  "/app/venv/bin/pip install --upgrade pip",
  "cd backend && /app/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd backend && /app/venv/bin/python manage.py collectstatic --noinput",
  "cd backend && /app/venv/bin/python manage.py migrate --noinput"
]

[start]
cmd = "bash start.sh"
